[platformio]
default_envs = seizo_s3_st7789

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -DBOARD_HAS_PSRAM
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DSEIZO_REFERENCE_FIRMWARE=1

[env:seizo_s3_st7789]
build_flags = ${env.build_flags} -DSEIZO_DISPLAY_ST7789=1

[env:seizo_s3_hx8347d]
build_flags = ${env.build_flags} -DSEIZO_DISPLAY_HX8347D=1

; Exactly one protocol owner is compiled: native USB CDC (above) or Pi UART.
; This UART variant leaves USB CDC available to the board but does not read
; commands from, or send panel telemetry to, it.
[env:seizo_s3_st7789_uart]
build_flags = ${env.build_flags} -DSEIZO_DISPLAY_ST7789=1 -DSEIZO_HOST_UART=1


